# golangci-lint v2 config. gosec and govulncheck run as their own CI steps.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - nolintlint
    - revive
    - unconvert
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
        - name: unused-parameter
          disabled: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests set up fixtures with plain writes and don't need every error checked.
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
